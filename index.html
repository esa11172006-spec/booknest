<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest - Каталог</title>
  
  <!-- Твои стили из ЛР2 -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a href="index.html" class="logo">BookNest</a>
      <nav class="nav">
        <a href="#catalog">Каталог</a>
        <a href="#wishlist">Мой список: <span class="wishlist-counter">0</span></a>
      </nav>
    </div>
  </header>

  <main class="main">
    <h1>Каталог книг</h1>

    <!-- ФОРМА ФИЛЬТРОВ -->
    <form class="filters-form">
      <fieldset>
        <legend>Фильтры</legend>
        
        <div class="form-group">
          <label for="search">Поиск</label>
          <input type="search" id="search" name="query" placeholder="Название или автор">
        </div>

        <div class="form-group">
          <label for="genre">Жанр</label>
          <select id="genre" name="genre">
            <option value="">Все жанры</option>
            <!-- Опции подтянутся из JS -->
          </select>
        </div>

        <div class="form-group">
          <label for="sortBy">Сортировка</label>
          <select id="sortBy" name="sortBy">
            <option value="title">По названию (А-Я)</option>
            <option value="year">По году (сначала новые)</option>
            <option value="rating">По рейтингу</option>
          </select>
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" name="onlyAvailable"> Только доступные
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" class="button">Применить</button>
          <button type="button" class="button reset-btn">Сбросить</button>
        </div>
      </fieldset>
    </form>

    <!-- СЧЕТЧИК -->
    <h2 class="catalog-counter">Найдено книг: 0</h2>

    <!-- СЕТКА ДЛЯ КАРТОЧЕК -->
    <div class="catalog-grid" id="catalog"></div>

    <!-- ПУСТОЕ СОСТОЯНИЕ -->
    <div class="empty-state" hidden>Ничего не найдено. Попробуйте изменить фильтры.</div>

    <!-- МОЙ СПИСОК (WISHLIST) -->
    <section class="wishlist" id="wishlist">
      <h2>Мой список</h2>
      <div class="wishlist-grid catalog-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2024 BookNest — книжный клуб университета</p>
  </footer>

  <!-- ПОДКЛЮЧЕНИЕ СКРИПТА -->
  <script type="module" src="main.js"></script>
</body>
</html>
